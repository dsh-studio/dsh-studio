<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Studio</title>
    <style>
      /* 启动页:host 就绪后由 Rust 侧导航到 dsh web,本页只活几百毫秒。
         白底;logo 用 macOS 圆角版图标(自带透明边距)。 */
      :root { --ink: #1a1a1a; --muted: #6b6b6b; --red: #d64530; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
        background: #ffffff; color: var(--ink);
        display: flex; align-items: center; justify-content: center;
        -webkit-font-smoothing: antialiased; overflow: hidden;
      }
      .drag { position: fixed; top: 0; left: 0; right: 0; height: 44px; }
      .boot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .boot img { width: 128px; height: 128px; }
      .boot h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      #status { font-size: 12.5px; color: var(--muted); max-width: 520px; text-align: center; }
      #status.err { color: var(--red); user-select: text; }
      .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    </style>
  </head>
  <body>
    <div class="drag" data-tauri-drag-region></div>
    <div class="boot">
      <img src="/splash-logo.png" alt="" />
      <h1>DSH Studio</h1>
      <div id="status"><span class="dots">正在启动本机 AI runtime</span></div>
    </div>
    <script type="module">
      // host 起不来时把 stderr/fatal 原样亮给用户;正常路径不需要本脚本
      const status = document.getElementById("status");
      const tauri = window.__TAURI__;
      if (tauri?.event?.listen) {
        tauri.event.listen("dsh-line", ({ payload }) => {
          if (typeof payload !== "string") return;
          if (payload.startsWith("[fatal]") || payload.startsWith("[err]") || payload === "[exit]") {
            status.textContent = payload === "[exit]" ? "runtime 意外退出,请重启应用" : payload;
            status.classList.add("err");
          }
        });
      }
    </script>
  </body>
</html>
